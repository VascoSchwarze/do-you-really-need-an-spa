  - name: "Kardamompulver"
    amount: 0.25
    unit: "TL"
  - name: "Zitronensaft"
    amount: 1
    unit: "TL"
  - name: "Zwiebel"
    amount: 1
    unit: "Stück"
  - name: "Ghee"
    amount: 3
    unit: "EL"
  - name: "Gewürznelken"
    amount: 4
    unit: "Stück"
  - name: "Grüne Kardamomsamen"
    amount: 3
    unit: "Stück"
  - name: "Nelkenpulver"
    amount: 0.25
    unit: "TL"
  - name: "Tomaten"
    amount: 4
    unit: "Stück"
  - name: "Geschälte Tomaten, Dose"
    amount: 400
