  - name: "Garam Masala, gemahlen"
    amount: 2.5
    unit: "TL"
  - name: "Chilipulver"
    amount: 1.5
    unit: "TL"
  - name: "Korianderpulver"
    amount: 1
    unit: "TL"
  - name: "Knoblauchzehen"
    amount: 4
    unit: "Stück"
  - name: "Ingwer, gehackt"
    amount: 1
    unit: "EL"
  - name: "Hähnchenschenkel oder -brustfilet, grob geschnitten"
    amount: 700
