title:
  de: "Kurz mariniertes Butter Chicken"
  en: "Quick-Marinated Butter Chicken"
description:
  de: "Cremiges, kurz mariniertes Butter-Hähnchen in würziger Tomatensauce."
  en: "Creamy, briefly marinated butter chicken in a spiced tomato sauce."
category: "Fleisch"
cookTime: 75
difficulty: 4
servings: 4
featured: true
image: "/images/recipes/butter-chicken.jpg"
