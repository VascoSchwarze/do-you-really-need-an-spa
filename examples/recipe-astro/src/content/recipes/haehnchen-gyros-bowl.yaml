title:
  de: "Hähnchen-Gyros-Bowl"
  en: "Chicken Gyros Bowl"
description:
  de: "Mediterrane Bowl mit gewürztem Hähnchen, Reis, Tzatziki und frischem Gemüse."
  en: "Mediterranean bowl with seasoned chicken, rice, tzatziki and fresh vegetables."
category: "Fleisch"
cookTime: 35
difficulty: 2
servings: 4
featured: false
image: "/images/recipes/haehnchen-gyros-bowl.svg"
ingredients:
  - name: "Hähnchenbrustfilet"
    amount: 500
    unit: "g"
  - name: "Gyrosgewürz"
    amount: 2
    unit: "EL"
  - name: "Olivenöl"
    amount: 2
    unit: "EL"
  - name: "Reis"
    amount: 300
    unit: "g"
  - name: "Gurke"
    amount: 1
    unit: "Stück"
  - name: "Cherrytomaten"
    amount: 200
    unit: "g"
  - name: "Rote Zwiebel"
    amount: 1
    unit: "Stück"
  - name: "Feta"
    amount: 150
    unit: "g"
  - name: "Tzatziki"
    amount: 200
    unit: "g"
steps:
  - "Hähnchenbrust in Streifen schneiden und mit Gyrosgewürz und Olivenöl marinieren."
  - "Reis nach Packungsangabe kochen."
  - "Gurke, Tomaten und rote Zwiebel klein schneiden."
  - "Hähnchen in einer heißen Pfanne 6–8 Minuten braten, bis es durchgegart ist."
  - "Reis auf Schalen verteilen und mit Gemüse, Hähnchen und Feta belegen."
  - "Mit einem Klecks Tzatziki servieren."
