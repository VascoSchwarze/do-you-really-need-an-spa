title:
  de: "Chili con Carne"
  en: "Chili con Carne"
description:
  de: "Herzhaftes Eintopfgericht mit Hackfleisch, Bohnen und Mais – perfekt für kalte Tage."
  en: "Hearty stew with ground beef, beans and corn – perfect for cold days."
category: "Fleisch"
cookTime: 45
difficulty: 2
servings: 4
featured: true
image: "/images/recipes/chili-con-carne.svg"
ingredients:
  - name: "Rinderhackfleisch"
    amount: 500
    unit: "g"
  - name: "Zwiebel"
    amount: 1
    unit: "Stück"
  - name: "Knoblauchzehen"
    amount: 2
    unit: "Stück"
  - name: "Kidneybohnen (Dose, abgetropft)"
    amount: 400
    unit: "g"
  - name: "Mais (Dose, abgetropft)"
    amount: 200
    unit: "g"
  - name: "Gehackte Tomaten (Dose)"
    amount: 800
    unit: "g"
  - name: "Tomatenmark"
    amount: 2
    unit: "EL"
  - name: "Paprikapulver"
    amount: 2
    unit: "TL"
  - name: "Kreuzkümmel"
    amount: 1
    unit: "TL"
  - name: "Chilipulver"
    amount: 1
    unit: "TL"
steps:
  - "Zwiebel und Knoblauch fein würfeln."
  - "Hackfleisch in einem großen Topf ohne Öl scharf anbraten und krümelig braten."
  - "Zwiebel und Knoblauch zugeben und glasig dünsten."
  - "Tomatenmark einrühren und kurz mitrösten."
  - "Gehackte Tomaten, Gewürze, Bohnen und Mais zugeben, verrühren."
  - "Zugedeckt bei niedriger Hitze 25 Minuten köcheln lassen, gelegentlich umrühren."
  - "Mit Salz und Pfeffer abschmecken und servieren."
