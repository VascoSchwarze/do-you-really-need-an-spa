title:
  de: "Caprese-Toast mit Pesto"
  en: "Caprese Toast with Pesto"
description:
  de: "Knuspriges Ciabatta mit Mozzarella, Tomaten und selbstgemachtem Pesto."
  en: "Crispy ciabatta with mozzarella, tomatoes and homemade pesto."
category: "Vegetarisch"
cookTime: 15
difficulty: 1
servings: 2
featured: false
image: "/images/recipes/caprese-toast-mit-pesto.svg"
ingredients:
  - name: "Ciabatta"
    amount: 1
    unit: "Stück"
  - name: "Mozzarella"
    amount: 150
    unit: "g"
  - name: "Tomaten"
    amount: 2
    unit: "Stück"
  - name: "Basilikumpesto"
    amount: 3
    unit: "EL"
  - name: "Olivenöl"
    amount: 1
    unit: "EL"
  - name: "Balsamico-Creme"
    amount: 1
    unit: "EL"
steps:
  - "Ciabatta längs halbieren und mit Olivenöl beträufeln."
  - "Im Ofen oder Toaster goldbraun rösten."
  - "Pesto auf den warmen Toast streichen."
  - "Mozzarella und Tomaten in Scheiben schneiden und darauf verteilen."
  - "Mit Balsamico-Creme beträufeln und sofort servieren."
