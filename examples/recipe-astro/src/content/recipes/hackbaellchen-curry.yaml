title:
  de: "Hackbällchen-Curry"
  en: "Meatball Curry"
description:
  de: "Würziges Hackbällchen-Curry mit Kartoffeln in einer aromatischen Tomaten-Gewürzsauce."
  en: "A spiced meatball curry with potatoes in an aromatic tomato-spice sauce."
