title:
  de: "Nudel-Risotto mit Erbsen"
  en: "One-Pot Pasta Risotto with Peas"
description:
  de: "Cremiges One-Pot-Gericht aus Hörnchennudeln, Erbsen und würzigem Frischkäse."
  en: "A creamy one-pot dish of small pasta shells, peas, and tangy herb cream cheese."
category: "Vegetarisch"
cookTime: 25
difficulty: 1
servings: 4
featured: true
image: "/images/recipes/nudel-risotto-mit-erbsen.jpg"
ingredients:
  - name: "Hörnchennudeln"
    amount: 200
    unit: "g"
  - name: "Erbsen, frisch oder TK"
    amount: 200
    unit: "g"
  - name: "Gemüsebrühe"
    amount: 600
    unit: "ml"
  - name: "Frischkäse, (Knoblauch od. Kräuter)"
    amount: 150
    unit: "g"
  - name: "Olivenöl"
    amount: 4
    unit: "EL"
steps:
  - "Die Gemüsebrühe erhitzen."
  - "Hörnchennudeln, Erbsen und die heiße Gemüsebrühe in einen Schmortopf geben. Gut 20 Minuten unter Rühren kochen, bis die gesamte Flüssigkeit aufgenommen ist."
  - "Frischkäse und Olivenöl hinzufügen, salzen, pfeffern, vermischen und sofort servieren."
